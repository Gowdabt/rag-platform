<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.5; color: #111;">
  <p>Hello {{userName}},</p>
  <p>A password reset was requested for your {{applicationName}} account in organization <strong>{{tenantName}}</strong> (tenant ID {{tenantSlug}}).</p>
  <p><a href="{{resetUrl}}">Choose a new password</a> — this link expires in {{expiresIn}}.</p>
  <p>If you did not request this, you can ignore this email.</p>
  <p>— {{applicationName}}</p>
</body>
</html>
