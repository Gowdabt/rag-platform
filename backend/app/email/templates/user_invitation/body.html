<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.5; color: #111;">
  <p>Hello {{userName}},</p>
  <p>{{inviterName}} invited you to <strong>{{tenantName}}</strong> on {{applicationName}} as {{roleName}}.</p>
  <p><a href="{{inviteUrl}}">Accept invitation and choose a password</a> — expires in {{expiresIn}}.</p>
  <p>Then sign in with tenant ID <strong>{{tenantSlug}}</strong>, your email, and the password you set.</p>
  <p><a href="{{loginUrl}}">Sign in</a></p>
  <p>— {{applicationName}}</p>
</body>
</html>
