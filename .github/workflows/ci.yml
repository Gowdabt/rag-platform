name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAG_ENV: development
      RAG_CONFIG_DIR: configs
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      DATABASE_URL_SYNC: postgresql+psycopg://rag:rag@localhost:5432/rag
      JWT_SECRET: ci-test-secret-not-for-production-use-32bytes
      RAG_ALLOW_PUBLIC_SIGNUP: "1"
      RAG_DB_NULL_POOL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend/app tests
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Pytest
        run: PYTHONPATH=backend RAG_CONFIG_DIR=configs pytest tests -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
